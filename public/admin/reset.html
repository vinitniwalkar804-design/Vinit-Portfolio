<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reset Password · Portfolio Admin</title>
  <meta name="theme-color" content="#06070d" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <div class="auth-stage" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo"><span class="dot"></span>Portfolio Admin</div>
      <div class="auth-icon">🔐</div>
      <h1>Choose a new password</h1>
      <p class="intro">Set a new password for your admin account. Use at least 8 characters.</p>

      <form id="resetForm" novalidate autocomplete="off">
        <div class="field">
          <label for="password">New password</label>
          <input class="field-input" type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8" maxlength="72" />
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input class="field-input" type="password" id="confirm" name="confirm" placeholder="Repeat new password" autocomplete="new-password" required minlength="8" maxlength="72" />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Set new password</button>
      </form>

      <div class="auth-foot"><a href="/vinit-control/login">Back to sign in</a></div>
    </div>
  </div>

  <div id="toasts"></div>

  <script>
    window.__ADMIN_PAGE__ = 'reset';
  </script>
  <script src="/admin/js/auth.js"></script>
</body>
</html>
